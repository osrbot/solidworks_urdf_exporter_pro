name: SolidWorks integration gate

on:
  workflow_dispatch:
    inputs:
      solidworks_install_dir:
        description: Absolute directory containing the SolidWorks interop assemblies
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solidworks-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-installer:
    runs-on: [self-hosted, Windows, X64, solidworks]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Test portable Core first
        shell: pwsh
        run: |
          dotnet restore tests/OSURDF.Core.Tests/OSURDF.Core.Tests.csproj --locked-mode
          dotnet test tests/OSURDF.Core.Tests/OSURDF.Core.Tests.csproj --configuration Release --no-restore

      - name: Build immutable SolidWorks installer candidate
        shell: pwsh
        env:
          SOLIDWORKS_INSTALL_DIR: ${{ inputs.solidworks_install_dir }}
        run: ./scripts/BuildInstaller.ps1 -SolidWorksInstallDir $env:SOLIDWORKS_INSTALL_DIR

      - name: Record candidate inventory
        shell: pwsh
        run: |
          Get-ChildItem INSTALL/OUTPUT/sw2urdfSetup_*.exe* |
            Select-Object Name, Length, @{Name='SHA256';Expression={(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}} |
            Format-Table -AutoSize
