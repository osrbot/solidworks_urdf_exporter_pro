name: Create draft installer release candidate (manual approval)

on:
  workflow_dispatch:
    inputs:
      confirm_tested:
        description: "I confirm that the candidate was manually tested and is approved for Draft Release creation."
        required: true
        default: false
        type: boolean
      installer:
        description: "Installer path, for example INSTALL/OUTPUT/sw2urdfSetup_20260629_598c7dd.exe. Leave empty to select the newest committed candidate."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-installer-release
  cancel-in-progress: false

jobs:
  create-draft-installer:
    if: inputs.confirm_tested == true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install installer inspection tool
        shell: bash
        run: |
          set -euo pipefail

          innoextract_commit="6e9e34ed0876014fdb46e684103ef8c3605e382e"
          innoextract_sha256="4d885b27e452dcb137a9d97736b19478447f172bcfed1aa98d80138e9a4c08ae"
          archive="$RUNNER_TEMP/innoextract.tar.gz"
          source_dir="$RUNNER_TEMP/innoextract-source"
          build_dir="$RUNNER_TEMP/innoextract-build"

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            libboost-date-time-dev \
            libboost-filesystem-dev \
            libboost-iostreams-dev \
            libboost-program-options-dev \
            libboost-system-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev

          curl --fail --location --retry 3 \
            "https://codeload.github.com/dscharrer/innoextract/tar.gz/$innoextract_commit" \
            --output "$archive"
          printf '%s  %s\n' "$innoextract_sha256" "$archive" | sha256sum --check

          mkdir -p "$source_dir" "$build_dir"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$source_dir"
          cmake -S "$source_dir" -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF
          cmake --build "$build_dir" --config Release --parallel 2
          sudo install -m 0755 "$build_dir/innoextract" /usr/local/bin/innoextract
          innoextract --version

      - name: Select installer
        id: installer
        shell: bash
        env:
          INPUT_INSTALLER: ${{ github.event.inputs.installer }}
        run: |
          set -euo pipefail

          canonical_text_sha256() {
            python3 -B -c '
          import hashlib
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8-sig")
          normalized = text.replace("\r\n", "\n").replace("\r", "\n")
          print(hashlib.sha256(normalized.encode("utf-8")).hexdigest())
          ' "$1"
          }

          input_installer="$INPUT_INSTALLER"
          installer=""

          if [[ -n "$input_installer" ]]; then
            installer="$input_installer"
          fi

          if [[ -z "$installer" ]]; then
            installer="$(
              while IFS= read -r candidate; do
                commit_time="$(git log -1 --format=%ct -- "$candidate")"
                [[ -n "$commit_time" ]] && printf '%s\t%s\n' "$commit_time" "$candidate"
              done < <(find INSTALL/OUTPUT -maxdepth 1 -type f -name "sw2urdfSetup_*.exe" -print | sort) |
              sort -k1,1nr -k2,2r |
              awk -F '\t' 'NR == 1 {print $2}'
            )"
          fi

          if [[ -z "$installer" || ! -f "$installer" ]]; then
            echo "No installer artifact found." >&2
            exit 1
          fi
          if [[ "$installer" != INSTALL/OUTPUT/sw2urdfSetup_*.exe ]]; then
            echo "Installer must be a committed artifact under INSTALL/OUTPUT: $installer" >&2
            exit 1
          fi

          filename="$(basename "$installer")"
          if [[ ! "$filename" =~ ^sw2urdfSetup_([0-9]{8})_([0-9a-f]{7,40})\.exe$ ]]; then
            echo "Installer filename must match sw2urdfSetup_YYYYMMDD_<commit>.exe: $filename" >&2
            exit 1
          fi

          release_date="${BASH_REMATCH[1]}"
          release_commit="${BASH_REMATCH[2]}"
          release_tag="v${release_date}"
          if ! source_sha="$(git rev-parse --verify "${release_commit}^{commit}" 2>/dev/null)"; then
            echo "Installer source commit does not exist: $release_commit" >&2
            exit 1
          fi
          artifact_sha="$(git log -1 --format=%H -- "$installer")"
          if [[ -z "$artifact_sha" ]]; then
            echo "Installer is not committed: $installer" >&2
            exit 1
          fi
          artifact_parent="$(git rev-parse "${artifact_sha}^1")"
          if [[ "$artifact_parent" != "$source_sha" ]]; then
            echo "Installer filename commit $release_commit is not the parent of artifact commit $artifact_sha." >&2
            exit 1
          fi
          sha256_path="${installer}.sha256"
          provenance_path="${installer}.provenance.json"
          if [[ ! -f "$sha256_path" || ! -f "$provenance_path" ]]; then
            echo "Installer checksum or provenance sidecar is missing." >&2
            exit 1
          fi
          if [[ "$(git log -1 --format=%H -- "$sha256_path")" != "$artifact_sha" ||
                "$(git log -1 --format=%H -- "$provenance_path")" != "$artifact_sha" ]]; then
            echo "Installer and provenance sidecars must be committed together." >&2
            exit 1
          fi
          mapfile -t artifact_changes < <(
            git diff --name-only "$source_sha" "$artifact_sha" | sort
          )
          mapfile -t expected_artifact_changes < <(
            printf '%s\n' "$installer" "$sha256_path" "$provenance_path" | sort
          )
          if [[ "${artifact_changes[*]}" != "${expected_artifact_changes[*]}" ]]; then
            echo "Artifact commit must change only the installer and its two sidecars." >&2
            printf 'Changed: %s\n' "${artifact_changes[@]}" >&2
            exit 1
          fi
          sha256sum --check "$sha256_path"
          actual_sha256="$(sha256sum "$installer" | awk '{print $1}')"
          source_tree="$(git rev-parse "${source_sha}^{tree}")"
          if [[ "$(jq -r '.schemaVersion' "$provenance_path")" != "2" ||
                "$(jq -r '.trustModel' "$provenance_path")" != "local-build-from-immutable-git-worktree" ||
                "$(jq -r '.evidenceModel' "$provenance_path")" != "traceable-build-inputs-not-bit-reproducible" ||
                "$(jq -r '.sourceCommit' "$provenance_path")" != "$source_sha" ||
                "$(jq -r '.sourceTree' "$provenance_path")" != "$source_tree" ||
                "$(jq -r '.sourceCommitShort' "$provenance_path")" != "$release_commit" ||
                "$(jq -r '.installerDate' "$provenance_path")" != "$release_date" ||
                "$(jq -r '.installerFile' "$provenance_path")" != "$filename" ||
                "$(jq -r '.installerSha256' "$provenance_path")" != "$actual_sha256" ||
                "$(jq -r '.configuration' "$provenance_path")" != "Release" ||
                "$(jq -r '.platform' "$provenance_path")" != "x64" ||
                "$(jq -r '.nugetSource' "$provenance_path")" != "https://api.nuget.org/v3/index.json" ||
                "$(jq -r '.packageInputs | length' "$provenance_path")" -lt 1 ||
                "$(jq -r '.solidWorksInputs | length' "$provenance_path")" -ne 4 ]]; then
            echo "Installer provenance does not match the selected source and binary." >&2
            exit 1
          fi
          if ! jq -e '
              (.tools.nuget.sha256 | test("^[0-9a-f]{64}$")) and
              (.tools.msbuild.sha256 | test("^[0-9a-f]{64}$")) and
              (.tools.innoSetup.sha256 | test("^[0-9a-f]{64}$")) and
              (.tools.dotnet.version == "8.0.424") and
              (.tools.dotnet.sha256 | test("^[0-9a-f]{64}$")) and
              (all(.packageInputs[]; .id != "" and .version != "" and
                (.sha256 | test("^[0-9a-f]{64}$")))) and
              (.sdkPackageLocks | length == 3) and
              (all(.sdkPackageLocks[];
                (.path | test("^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$)).+packages\\.lock\\.json$")) and
                (.sha256 | test("^[0-9a-f]{64}$")))) and
              (.legacyTestPackageLock.path == "scripts/legacy-test-packages.lock.json") and
              (.legacyTestPackageLock.sha256 | test("^[0-9a-f]{64}$")) and
              (.legacyTestPackageLock.packagesConfigPath == "SW2URDF/packages.config") and
              (.legacyTestPackageLock.packagesConfigSha256 | test("^[0-9a-f]{64}$")) and
              (.legacyTestPackageInputs | length > 0) and
              (all(.legacyTestPackageInputs[]; .id != "" and .version != "" and
                (.sha256 | test("^[0-9a-f]{64}$")))) and
              (all(.solidWorksInputs[]; .file != "" and
                (.sha256 | test("^[0-9a-f]{64}$")))) and
              (.pluginTests.configuration == "Test") and
              (.pluginTests.platform == "x64") and
              (.pluginTests.result == "passed") and
              (.pluginTests.runner == "TestRunner/bin/Release/net48/TestRunner.exe") and
              (.pluginTests.selection == "exclude-live-solidworks") and
              (.pluginTests.testAssemblySha256 | test("^[0-9a-f]{64}$")) and
              (.pluginTests.deepReferenceLiveApi == "not_requested") and
              (.pluginTests.crossVersionSolidWorks == "not_run") and
              (.coreTests.result == "passed") and
              (.coreTests.bundledOpenUsdIntegration == "passed") and
              (.coreTests.bundledMuJoCoIntegration == "passed") and
              (.assetRuntimeInputs | length == 3) and
              (all(.assetRuntimeInputs[]; .id != "" and .version != "" and
                (.sha256 | test("^[0-9a-f]{64}$")))) and
              (.payloadInputs | length > 0) and
              (any(.payloadInputs[]; .path == "SW2URDF.dll")) and
              (any(.payloadInputs[]; .path == "OSURDF.Core.dll")) and
              (any(.payloadInputs[]; .path == "Newtonsoft.Json.dll")) and
              (any(.payloadInputs[]; .path == "THIRD_PARTY_LICENSES/APACHE-2.0.txt")) and
              (any(.payloadInputs[]; .path == "THIRD_PARTY_LICENSES/MIT.txt")) and
              (any(.payloadInputs[]; .path == "schemas/robot.schema.v2.json")) and
              (all(.payloadInputs[];
                (.path | test("^schemas/(isaac-profile|isaaclab-profile|isaaclab-actuator-profile)")) | not)) and
              (any(.payloadInputs[]; .path == "tools/usd_adapter/osurdf_usd_adapter.py")) and
              (any(.payloadInputs[]; .path == "tools/openusd_runtime/python.exe")) and
              (any(.payloadInputs[]; .path == "tools/mujoco_runtime/compile.exe")) and
              (any(.payloadInputs[]; .path == "tools/mujoco_runtime/testspeed.exe")) and
              (any(.payloadInputs[]; .path == "tools/mujoco_runtime/mujoco.dll")) and
              (all(.payloadInputs[]; .path != "" and
                (.sha256 | test("^[0-9a-f]{64}$"))))
            ' "$provenance_path" >/dev/null; then
            echo "Installer provenance contains invalid build input records." >&2
            exit 1
          fi
          while IFS=$'\t' read -r lock_path expected_hash; do
            lock_copy="$(mktemp)"
            if ! git show "${source_sha}:${lock_path}" > "$lock_copy" ||
               [[ "$(canonical_text_sha256 "$lock_copy")" != "$expected_hash" ]]; then
              echo "SDK package lock provenance mismatch: $lock_path" >&2
              exit 1
            fi
          done < <(jq -r '.sdkPackageLocks[] | [.path, .sha256] | @tsv' "$provenance_path")
          expected_sdk_locks="$(
            printf '%s\n' \
              "TestRunner/packages.lock.json" \
              "src/OSURDF.Core/packages.lock.json" \
              "tests/OSURDF.Core.Tests/packages.lock.json" | sort
          )"
          provenance_sdk_locks="$(jq -r '.sdkPackageLocks[].path' "$provenance_path" | sort)"
          if [[ "$provenance_sdk_locks" != "$expected_sdk_locks" ]]; then
            echo "Installer provenance does not contain the exact required SDK package locks." >&2
            exit 1
          fi

          legacy_lock="$(mktemp)"
          legacy_packages_config="$(mktemp)"
          git show "${source_sha}:scripts/legacy-test-packages.lock.json" > "$legacy_lock"
          git show "${source_sha}:SW2URDF/packages.config" > "$legacy_packages_config"
          if [[ "$(canonical_text_sha256 "$legacy_lock")" !=
                "$(jq -r '.legacyTestPackageLock.sha256' "$provenance_path")" ||
                "$(canonical_text_sha256 "$legacy_packages_config")" !=
                "$(jq -r '.legacyTestPackageLock.packagesConfigSha256' "$provenance_path")" ||
                "$(jq -r '.packagesConfig.sha256' "$legacy_lock")" !=
                "$(jq -r '.legacyTestPackageLock.packagesConfigSha256' "$provenance_path")" ]]; then
            echo "Legacy test dependency lock provenance does not match the source commit." >&2
            exit 1
          fi
          locked_legacy_packages="$(
            jq -S -c '[.packages[] | {id, version, sha256}] | sort_by(.id, .version)' "$legacy_lock"
          )"
          provenance_legacy_packages="$(
            jq -S -c '.legacyTestPackageInputs | sort_by(.id, .version)' "$provenance_path"
          )"
          if [[ "$locked_legacy_packages" != "$provenance_legacy_packages" ]]; then
            echo "Legacy test package provenance does not match the content-hash lock." >&2
            exit 1
          fi
          openusd_lock="$(mktemp)"
          mujoco_lock="$(mktemp)"
          git show "${source_sha}:tools/openusd_runtime.lock.json" > "$openusd_lock"
          git show "${source_sha}:tools/mujoco_runtime.lock.json" > "$mujoco_lock"
          locked_asset_runtimes="$(
            jq -n -S -c \
              --slurpfile openusd "$openusd_lock" \
              --slurpfile mujoco "$mujoco_lock" '
                [
                  {
                    id: "python-embed",
                    version: ($openusd[0].python.version | tostring),
                    sha256: $openusd[0].python.sha256
                  },
                  {
                    id: "usd-core",
                    version: ($openusd[0].usdCore.version | tostring),
                    sha256: $openusd[0].usdCore.sha256
                  },
                  {
                    id: "mujoco",
                    version: ($mujoco[0].version | tostring),
                    sha256: $mujoco[0].archive.sha256
                  }
                ] | sort_by(.id, .version)'
          )"
          provenance_asset_runtimes="$(
            jq -S -c '.assetRuntimeInputs | sort_by(.id, .version)' "$provenance_path"
          )"
          if [[ "$locked_asset_runtimes" != "$provenance_asset_runtimes" ]]; then
            echo "Installer asset runtime provenance does not match the source runtime locks." >&2
            exit 1
          fi
          release_lock="$(mktemp)"
          git show "${source_sha}:SW2URDF/packages.release.lock.json" > "$release_lock"
          locked_packages="$(jq -S -c '.packages | sort_by(.id, .version)' "$release_lock")"
          provenance_packages="$(jq -S -c '.packageInputs | sort_by(.id, .version)' "$provenance_path")"
          locked_nuget_version="$(jq -r '.nuget.version' "$release_lock")"
          provenance_nuget_version="$(jq -r '.tools.nuget.version' "$provenance_path")"
          locked_nuget_sha256="$(jq -r '.nuget.sha256' "$release_lock")"
          provenance_nuget_sha256="$(jq -r '.tools.nuget.sha256' "$provenance_path")"
          if [[ "$locked_packages" != "$provenance_packages" ||
                "$locked_nuget_version" != "$provenance_nuget_version" ||
                "$locked_nuget_sha256" != "$provenance_nuget_sha256" ]]; then
            echo "Installer provenance does not match the source commit's release lock." >&2
            exit 1
          fi

          extracted_installer="$(mktemp -d)"
          innoextract --silent --extract --output-dir "$extracted_installer" "$installer"
          expected_payloads="$(mktemp)"
          actual_payloads="$(mktemp)"
          jq -r '.payloadInputs[].path' "$provenance_path" | sort -u > "$expected_payloads"
          find "$extracted_installer/app" -type f -printf '%P\n' | sort -u > "$actual_payloads"
          if ! diff -u "$expected_payloads" "$actual_payloads"; then
            echo "Installer payload does not match the provenance manifest." >&2
            exit 1
          fi
          while IFS=$'\t' read -r relative_path expected_hash; do
            if [[ "$relative_path" == /* || "$relative_path" =~ (^|/)\.\.(/|$) ]]; then
              echo "Installer provenance contains an unsafe payload path: $relative_path" >&2
              exit 1
            fi
            extracted_path="$extracted_installer/app/$relative_path"
            if [[ ! -f "$extracted_path" ||
                  "$(sha256sum "$extracted_path" | awk '{print $1}')" != "$expected_hash" ]]; then
              echo "Extracted installer payload hash mismatch: $relative_path" >&2
              exit 1
            fi
          done < <(jq -r '.payloadInputs[] | [.path, .sha256] | @tsv' "$provenance_path")

          {
            echo "path=$installer"
            echo "sha256_path=$sha256_path"
            echo "provenance_path=$provenance_path"
            echo "filename=$filename"
            echo "date=$release_date"
            echo "commit=$release_commit"
            echo "source_sha=$source_sha"
            echo "artifact_sha=$artifact_sha"
            echo "tag=$release_tag"
            echo "create_draft=true"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release candidate
        if: steps.installer.outputs.create_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.installer.outputs.tag }}
          RELEASE_DATE: ${{ steps.installer.outputs.date }}
          RELEASE_COMMIT: ${{ steps.installer.outputs.commit }}
          RELEASE_SOURCE_SHA: ${{ steps.installer.outputs.source_sha }}
          RELEASE_ARTIFACT_SHA: ${{ steps.installer.outputs.artifact_sha }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          INSTALLER_SHA256_PATH: ${{ steps.installer.outputs.sha256_path }}
          INSTALLER_PROVENANCE_PATH: ${{ steps.installer.outputs.provenance_path }}
          INSTALLER_FILE: ${{ steps.installer.outputs.filename }}
        run: |
          set -euo pipefail

          notes_template="$(mktemp)"
          notes="$(mktemp)"
          release_date_display="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          release_notes_path=".github/release-notes/${RELEASE_TAG}.md"
          if ! git show "${RELEASE_SOURCE_SHA}:${release_notes_path}" > "$notes_template"; then
            echo "The source commit must contain reviewed bilingual release notes at ${release_notes_path}." >&2
            exit 1
          fi

          python3 - "$notes_template" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          first = next((line.strip() for line in text.splitlines() if line.strip()), "")
          if not first.startswith("# "):
              raise SystemExit("Release notes must start with a level-one bilingual title.")
          title = first[2:].strip()
          if not re.search(r"[A-Za-z]", title) or not re.search(r"[\u4e00-\u9fff]", title):
              raise SystemExit("Release notes title must contain English and Simplified Chinese.")
          if title.count("{{RELEASE_DATE}}") != 1:
              raise SystemExit("The bilingual release-notes title must contain {{RELEASE_DATE}} exactly once.")

          sections = {}
          positions = {}
          for heading in ("English", "简体中文"):
              matches = list(re.finditer(rf"(?m)^## {re.escape(heading)}[ \t]*$", text))
              if len(matches) != 1:
                  raise SystemExit(f"Release notes require exactly one non-empty ## {heading} section.")
              positions[heading] = matches[0].start()
              start = matches[0].end()
              following = re.search(r"(?m)^#{1,2} .+$", text[start:])
              body = text[start:start + following.start()] if following else text[start:]
              sections[heading] = body
              reviewed = re.sub(r"<!--.*?-->", "", body, flags=re.S)
              reviewed = re.sub(r"\{\{[A-Z0-9_]+\}\}", "", reviewed)
              reviewed = re.sub(r"(?m)^#{1,6} .*$", "", reviewed)
              if not re.search(r"[A-Za-z\u4e00-\u9fff]", reviewed):
                  raise SystemExit(f"Release notes section ## {heading} must contain reviewed text.")
          if positions["English"] >= positions["简体中文"]:
              raise SystemExit("The English release-notes section must precede Simplified Chinese.")

          fact_placeholders = (
              "{{INSTALLER_FILE}}",
              "{{INSTALLER_SHA256}}",
              "{{RELEASE_SOURCE_SHA}}",
              "{{RELEASE_ARTIFACT_SHA}}",
          )
          for heading, body in sections.items():
              for placeholder in fact_placeholders:
                  if body.count(placeholder) != 1:
                      raise SystemExit(
                          f"## {heading} must contain shared fact placeholder {placeholder} exactly once."
                      )
          PY

          for required_placeholder in \
            "{{RELEASE_DATE}}" \
            "{{INSTALLER_FILE}}" \
            "{{INSTALLER_SHA256}}" \
            "{{RELEASE_SOURCE_SHA}}" \
            "{{RELEASE_ARTIFACT_SHA}}"; do
            if ! grep -Fq "$required_placeholder" "$notes_template"; then
              echo "Release notes are missing required placeholder: ${required_placeholder}" >&2
              exit 1
            fi
          done

          installer_sha256="$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')"
          awk \
            -v release_date="$release_date_display" \
            -v installer_file="$INSTALLER_FILE" \
            -v installer_sha256="$installer_sha256" \
            -v source_sha="$RELEASE_SOURCE_SHA" \
            -v artifact_sha="$RELEASE_ARTIFACT_SHA" '
              {
                gsub(/\{\{RELEASE_DATE\}\}/, release_date)
                gsub(/\{\{INSTALLER_FILE\}\}/, installer_file)
                gsub(/\{\{INSTALLER_SHA256\}\}/, installer_sha256)
                gsub(/\{\{RELEASE_SOURCE_SHA\}\}/, source_sha)
                gsub(/\{\{RELEASE_ARTIFACT_SHA\}\}/, artifact_sha)
                print
              }
            ' "$notes_template" > "$notes"

          if grep -Eq '\{\{[A-Z0-9_]+\}\}' "$notes"; then
            echo "Release notes contain an unresolved placeholder." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              echo "Removing an incomplete draft before retrying ${RELEASE_TAG}."
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            else
              echo "Release tag ${RELEASE_TAG} already exists. Daily releases are immutable." >&2
              exit 1
            fi
          elif git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} already exists. Daily releases are immutable." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "$INSTALLER_PATH" \
            "$INSTALLER_SHA256_PATH" \
            "$INSTALLER_PROVENANCE_PATH" \
            --draft \
            --target "$RELEASE_SOURCE_SHA" \
            --title "SW2URDF Installer Candidate ${RELEASE_DATE} / SW2URDF 安装包候选 ${RELEASE_DATE}" \
            --notes-file "$notes"
