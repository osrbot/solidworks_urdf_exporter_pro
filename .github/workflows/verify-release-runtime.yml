name: Verify shipped Windows release runtime

on:
  push:
    branches: [codex/sw2-7-release]
    paths:
      - .github/workflows/verify-release-runtime.yml
      - scripts/Test-CleanReleaseRuntime.ps1
      - scripts/Test-ReleaseInstallLifecycle.ps1
      - scripts/Test-StableReleaseUpgrade.ps1
      - scripts/release_runtime_probe.py
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag (used when asset_id is empty)'
        type: string
        required: false
      asset_id:
        description: 'Exact GitHub release asset ID; bypasses draft release listing'
        type: string
        required: false
      installer_asset:
        description: 'Exact installer asset filename'
        type: string
        required: true
      installer_sha256:
        description: 'Expected installer SHA256'
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Shipped runtime on fresh Windows Server 2022
    # GitHub requires push-level access to expose unpublished draft assets.
    # The job performs only GET requests; no release/repository writes are used.
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download exact draft installer through authenticated GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v20260913' }}
          ASSET_ID: ${{ github.event_name == 'push' && '559578706' || inputs.asset_id }}
          INSTALLER_ASSET: ${{ inputs.installer_asset || 'sw2urdfSetup_20260911_a0af2c5.exe' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTALLER_ASSET -notmatch '^sw2urdfSetup_[0-9]{8}_[0-9a-f]{7,40}\.exe$') { throw 'Invalid asset filename' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/candidate" | Out-Null
          if ($env:ASSET_ID) {
            if ($env:ASSET_ID -notmatch '^[0-9]+$') { throw 'Invalid asset ID' }
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
            try {
              Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GH_REPO/releases/assets/$env:ASSET_ID" `
                -Headers $headers -OutFile "$env:RUNNER_TEMP/candidate/$env:INSTALLER_ASSET"
            } catch {
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
              throw "Direct authenticated asset download failed (HTTP $status); URL and credentials suppressed."
            }
          } else {
            gh release download "$env:RELEASE_TAG" --pattern "$env:INSTALLER_ASSET" --dir "$env:RUNNER_TEMP/candidate"
            if ($LASTEXITCODE -ne 0) { throw 'Authenticated draft asset download failed' }
          }
      - name: Install prerequisite and qualify the installed runtime
        shell: pwsh
        env:
          SW2URDF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INSTALLER_ASSET: ${{ inputs.installer_asset || 'sw2urdfSetup_20260911_a0af2c5.exe' }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 || 'bf7c25db6779b9eb1d6c4b1bfa1d369f4155e1c9a1799320283a9b2bc245eb0f' }}
        run: |
          ./scripts/Test-CleanReleaseRuntime.ps1 `
            -Installer "$env:RUNNER_TEMP/candidate/$env:INSTALLER_ASSET" `
            -InstallerSha256 "$env:INSTALLER_SHA256" `
            -OutputDirectory "$env:RUNNER_TEMP/runtime-evidence"
      - name: Verify exact-candidate overwrite uninstall and reinstall lifecycle
        shell: pwsh
        env:
          SW2URDF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INSTALLER_ASSET: ${{ inputs.installer_asset || 'sw2urdfSetup_20260911_a0af2c5.exe' }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 || 'bf7c25db6779b9eb1d6c4b1bfa1d369f4155e1c9a1799320283a9b2bc245eb0f' }}
        run: |
          ./scripts/Test-ReleaseInstallLifecycle.ps1 `
            -Installer "$env:RUNNER_TEMP/candidate/$env:INSTALLER_ASSET" `
            -InstallerSha256 "$env:INSTALLER_SHA256" `
            -RuntimeEvidenceDirectory "$env:RUNNER_TEMP/runtime-evidence"
      - name: Retain qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-evidence/**/*.json
            ${{ runner.temp }}/runtime-evidence/**/*.jsonl
            ${{ runner.temp }}/runtime-evidence/**/*.txt
            ${{ runner.temp }}/runtime-evidence/**/*.log
            !${{ runner.temp }}/runtime-evidence/installed/**
          if-no-files-found: warn
          retention-days: 30

  stable-upgrade:
    name: Published v20260906 to exact candidate upgrade
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write # Required only to download the unpublished candidate asset.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download pinned stable and candidate installers and provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = "$env:RUNNER_TEMP/stable-upgrade-inputs"
          New-Item -ItemType Directory -Path $download | Out-Null
          $assets = @(
            @{ id = '547403854'; name = 'sw2urdfSetup_20260906_fc88a14.exe' },
            @{ id = '547403856'; name = 'sw2urdfSetup_20260906_fc88a14.exe.provenance.json' },
            @{ id = '559578706'; name = 'sw2urdfSetup_20260911_a0af2c5.exe' },
            @{ id = '559578696'; name = 'sw2urdfSetup_20260911_a0af2c5.exe.provenance.json' }
          )
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
          foreach ($asset in $assets) {
            try {
              Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GH_REPO/releases/assets/$($asset.id)" `
                -Headers $headers -OutFile (Join-Path $download $asset.name)
            } catch {
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
              throw "Pinned upgrade input download failed (HTTP $status); URL and credentials suppressed."
            }
          }
      - name: Install stable then upgrade in place and qualify candidate
        shell: pwsh
        env:
          SW2URDF_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ./scripts/Test-StableReleaseUpgrade.ps1 `
            -DownloadDirectory "$env:RUNNER_TEMP/stable-upgrade-inputs" `
            -OutputDirectory "$env:RUNNER_TEMP/stable-upgrade-evidence"
      - name: Retain stable upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-stable-upgrade-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stable-upgrade-evidence/**/*.json
            ${{ runner.temp }}/stable-upgrade-evidence/**/*.jsonl
            ${{ runner.temp }}/stable-upgrade-evidence/**/*.txt
            ${{ runner.temp }}/stable-upgrade-evidence/**/*.log
            !${{ runner.temp }}/stable-upgrade-evidence/installed/**
          if-no-files-found: warn
          retention-days: 30
