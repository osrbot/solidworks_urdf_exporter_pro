name: Isaac Sim and Isaac Lab gate

on:
  workflow_dispatch:
    inputs:
      isaac_sim_version:
        description: Exact Isaac Sim version installed on the runner
        required: true
        default: "6.0.0"
        type: string
      run_isaac_lab:
        description: Generate and execute the Isaac Lab smoke test
        required: true
        default: false
        type: boolean
      isaac_lab_version:
        description: Exact importlib.metadata version installed on the runner; required when Isaac Lab is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: isaac-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert-and-smoke:
    runs-on: [self-hosted, Linux, X64, gpu, isaac-sim]
    timeout-minutes: 90
    env:
      OSURDF_ISAAC_WORK: ${{ runner.temp }}/osurdf-isaac-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build fixture Bundle
        shell: bash
        env:
          REQUESTED_ISAAC_SIM_VERSION: ${{ inputs.isaac_sim_version }}
          RUN_ISAAC_LAB: ${{ inputs.run_isaac_lab }}
          REQUESTED_ISAAC_LAB_VERSION: ${{ inputs.isaac_lab_version }}
        run: |
          set -euo pipefail
          : "${ISAAC_PYTHON:?Set ISAAC_PYTHON to the pinned Isaac Sim python.sh on the runner}"
          dotnet restore src/OSURDF.Cli/OSURDF.Cli.csproj --locked-mode
          dotnet build src/OSURDF.Cli/OSURDF.Cli.csproj -c Release --no-restore
          cli="src/OSURDF.Cli/bin/Release/net8.0/osurdf.dll"
          work="$OSURDF_ISAAC_WORK"
          mkdir -p "$work"
          dotnet "$cli" import-urdf \
            --input tests/fixtures/minimal_robot.urdf --output "$work/robot.json" \
            --model-license Apache-2.0 --isaac-sim-version "$REQUESTED_ISAAC_SIM_VERSION"
          if [[ "$RUN_ISAAC_LAB" == 'true' ]]; then
            [[ -n "$REQUESTED_ISAAC_LAB_VERSION" ]] || {
              echo "isaac_lab_version is required when run_isaac_lab is true" >&2
              exit 64
            }
            jq --arg version "$REQUESTED_ISAAC_LAB_VERSION" \
              --slurpfile profile tests/fixtures/minimal_isaaclab_profile.json \
              '.profiles.isaacLab = $profile[0] | .profiles.isaacLab.isaacLabVersion = $version' \
              "$work/robot.json" > "$work/robot-with-lab.json"
            mv "$work/robot-with-lab.json" "$work/robot.json"
          fi
          dotnet "$cli" bundle \
            --source-urdf tests/fixtures/minimal_robot.urdf \
            --robot "$work/robot.json" --output "$work/bundle"
          "$ISAAC_PYTHON" tools/isaac_adapter/osurdf_isaac_adapter.py convert \
            --bundle "$work/bundle" --output "$work/isaac-asset"
          usd_relative="$(jq -r .usdEntrypoint "$work/isaac-asset/conversion_report.json")"
          "$ISAAC_PYTHON" tools/isaac_adapter/osurdf_isaac_adapter.py validate-usd \
            --bundle "$work/bundle" --usd "$work/isaac-asset/$usd_relative" \
            --report "$work/isaac-asset/usd-validation.json"

      - name: Run the explicit Isaac Lab fixture smoke test
        if: inputs.run_isaac_lab
        shell: bash
        run: |
          set -euo pipefail
          : "${ISAACLAB_PYTHON:?Set ISAACLAB_PYTHON to the pinned Isaac Lab Python environment}"
          work="$OSURDF_ISAAC_WORK"
          usd_relative="$(jq -r .usdEntrypoint "$work/isaac-asset/conversion_report.json")"
          OSURDF_USD_PATH="$work/isaac-asset/$usd_relative" \
            "$ISAACLAB_PYTHON" "$work/isaac-asset/smoke_test.py" \
              --headless --report "$work/isaac-asset/isaaclab-smoke-report.json"

      - name: Clean temporary integration workspace
        if: always()
        shell: bash
        run: rm -rf -- "$OSURDF_ISAAC_WORK"
